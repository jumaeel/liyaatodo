<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="padGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f4fc"/>
      <stop offset="100%" stop-color="#e4e6f6"/>
    </linearGradient>
    <linearGradient id="pencilGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbc55f"/>
      <stop offset="100%" stop-color="#f3a429"/>
    </linearGradient>
  </defs>

  <!-- pad: blue drop shadow edge -->
  <rect x="16" y="26" width="84" height="86" rx="22" fill="#5b6cf2"/>
  <!-- pad body -->
  <rect x="14" y="18" width="84" height="86" rx="22" fill="url(#padGrad)"/>

  <!-- spiral binding -->
  <g fill="none" stroke-linecap="round">
    <path d="M31 30v9" stroke="#c5c9ef" stroke-width="7"/>
    <path d="M53 30v9" stroke="#c5c9ef" stroke-width="7"/>
    <path d="M75 30v9" stroke="#c5c9ef" stroke-width="7"/>
    <path d="M23 27a8.5 8.5 0 0 1 17 0" stroke="#1f2333" stroke-width="8"/>
    <path d="M45 27a8.5 8.5 0 0 1 17 0" stroke="#1f2333" stroke-width="8"/>
    <path d="M67 27a8.5 8.5 0 0 1 17 0" stroke="#1f2333" stroke-width="8"/>
  </g>

  <!-- checklist rows (3) -->
  <g>
    <rect x="24" y="44" width="16" height="16" rx="5" fill="#5b6cf2"/>
    <path d="M28 52l3 3 5.5-6.5" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="48" y="48" width="30" height="7" rx="3.5" fill="#cdd0ee"/>

    <rect x="24" y="66" width="16" height="16" rx="5" fill="#5b6cf2"/>
    <path d="M28 74l3 3 5.5-6.5" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="48" y="70" width="26" height="7" rx="3.5" fill="#cdd0ee"/>

    <rect x="24" y="88" width="16" height="16" rx="5" fill="#5b6cf2"/>
    <path d="M28 96l3 3 5.5-6.5" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="48" y="92" width="20" height="7" rx="3.5" fill="#cdd0ee"/>
  </g>

  <!-- pencil (diagonal, eraser top-right, tip lower-left) -->
  <g transform="rotate(45 86 40)">
    <rect x="77" y="12" width="18" height="15" rx="5" fill="#f4517d"/>
    <rect x="77" y="27" width="18" height="6" fill="#f7f8ff"/>
    <rect x="77" y="33" width="18" height="46" fill="url(#pencilGrad)"/>
    <rect x="83.5" y="33" width="5" height="46" fill="#fdd98f"/>
    <path d="M77 79h18l-9 17z" fill="#f0d6a3"/>
    <path d="M82.5 90l3.5-6.5 3.5 6.5-3.5 6z" fill="#2b2f45"/>
  </g>
</svg>
