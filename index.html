<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6366f1" />
  <title>Momentum · Daily Progress Dashboard</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236366f1'/%3E%3Cpath d='M28 52l14 14 30-32' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <!-- Tailwind CSS (CDN, configured below) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Segoe UI', 'system-ui', 'sans-serif'],
          },
          borderRadius: { xl2: '12px' },
        },
      },
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body class="h-full bg-[#f8fafc] text-slate-800 font-sans antialiased">

  <div class="flex h-full overflow-hidden">

    <!-- ============ SIDEBAR ============ -->
    <aside id="sidebar"
      class="sidebar fixed lg:static inset-y-0 left-0 z-40 w-72 bg-white border-r border-slate-200 flex flex-col
             -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out">

      <!-- Brand -->
      <div class="flex items-center gap-3 px-5 h-16 border-b border-slate-100 shrink-0">
        <div class="w-9 h-9 rounded-xl2 bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white shadow-sm">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <div>
          <h1 class="font-bold text-slate-900 leading-tight">Momentum</h1>
          <p class="text-xs text-slate-400 leading-tight">Daily Progress</p>
        </div>
      </div>

      <!-- Projects list -->
      <div class="flex-1 overflow-y-auto px-3 py-4">
        <div class="flex items-center justify-between px-2 mb-2">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Projects</span>
          <span id="projectCount" class="text-xs text-slate-400"></span>
        </div>
        <nav id="projectList" class="space-y-1"></nav>
      </div>

      <!-- Add project -->
      <div class="p-3 border-t border-slate-100 shrink-0">
        <form id="addProjectForm" class="flex gap-2">
          <input id="newProjectInput" type="text" maxlength="30" placeholder="New project…"
            class="flex-1 min-w-0 px-3 py-2 text-sm rounded-xl2 border border-slate-200 bg-slate-50
                   focus:bg-white focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none transition" />
          <button type="submit"
            class="shrink-0 w-9 h-9 rounded-xl2 bg-indigo-600 hover:bg-indigo-700 text-white grid place-items-center transition shadow-sm">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </form>
      </div>
    </aside>

    <!-- Mobile backdrop -->
    <div id="backdrop" class="fixed inset-0 bg-slate-900/40 z-30 hidden lg:hidden backdrop-blur-sm"></div>

    <!-- ============ MAIN ============ -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">

      <!-- Top bar -->
      <header class="h-16 shrink-0 bg-white/80 backdrop-blur border-b border-slate-200 flex items-center gap-3 px-4 sm:px-6">
        <button id="menuToggle" class="lg:hidden w-9 h-9 grid place-items-center rounded-xl2 hover:bg-slate-100 transition" aria-label="Menu">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="min-w-0">
          <h2 id="activeProjectName" class="font-bold text-lg text-slate-900 truncate leading-tight">General</h2>
          <p id="activeProjectMeta" class="text-xs text-slate-400 leading-tight">No tasks yet</p>
        </div>
        <button id="deleteProjectBtn" title="Delete this project"
          class="ml-auto hidden sm:inline-flex items-center gap-1.5 px-3 py-2 text-sm rounded-xl2 text-slate-500 hover:text-red-600 hover:bg-red-50 transition">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
          Delete project
        </button>
      </header>

      <!-- Scroll area -->
      <div class="flex-1 overflow-y-auto px-4 sm:px-6 py-6">
        <div class="max-w-3xl mx-auto space-y-6">

          <!-- Progress card -->
          <section class="bg-white rounded-xl2 border border-slate-200 shadow-sm p-6">
            <div class="flex items-end justify-between flex-wrap gap-3">
              <div>
                <p class="text-sm font-medium text-slate-400">Daily Progress</p>
                <p id="progressPercentLabel" class="text-4xl font-extrabold text-slate-900 tracking-tight tabular-nums">0%</p>
              </div>
              <div class="text-right">
                <p id="progressCountLabel" class="text-sm font-semibold text-slate-600">0 of 0 tasks completed</p>
                <p id="progressSubLabel" class="text-xs text-slate-400">Add a task to get started</p>
              </div>
            </div>
            <div class="mt-4 h-3 w-full rounded-full bg-slate-100 overflow-hidden">
              <div id="progressBar"
                class="h-full rounded-full bg-gradient-to-r from-indigo-500 via-violet-500 to-fuchsia-500"
                style="width:0%; transition: width 0.6s cubic-bezier(.4,0,.2,1);"></div>
            </div>
          </section>

          <!-- Add task card -->
          <section class="bg-white rounded-xl2 border border-slate-200 shadow-sm p-5">
            <form id="addTaskForm" class="space-y-3">
              <input id="taskTitle" type="text" required maxlength="120" placeholder="What needs to be done?"
                class="w-full px-4 py-3 rounded-xl2 border border-slate-200 bg-slate-50 text-[15px]
                       focus:bg-white focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none transition" />
              <div class="flex flex-col sm:flex-row gap-3">
                <label class="flex-1">
                  <span class="block text-xs font-medium text-slate-400 mb-1">Priority</span>
                  <select id="taskPriority"
                    class="w-full px-3 py-2.5 rounded-xl2 border border-slate-200 bg-slate-50 text-sm
                           focus:bg-white focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none transition">
                    <option value="High">🔴 High</option>
                    <option value="Medium" selected>🟠 Medium</option>
                    <option value="Low">⚪ Low</option>
                  </select>
                </label>
                <label class="flex-1">
                  <span class="block text-xs font-medium text-slate-400 mb-1">Deadline</span>
                  <input id="taskDeadline" type="date"
                    class="w-full px-3 py-2.5 rounded-xl2 border border-slate-200 bg-slate-50 text-sm
                           focus:bg-white focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none transition" />
                </label>
                <div class="sm:self-end">
                  <button type="submit"
                    class="w-full sm:w-auto px-5 py-2.5 rounded-xl2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold
                           shadow-sm hover:shadow transition flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                    Add Task
                  </button>
                </div>
              </div>
            </form>
          </section>

          <!-- Filters -->
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 mr-1">Show</span>
            <button data-filter="all"    class="filter-chip is-active">All</button>
            <button data-filter="active" class="filter-chip">Active</button>
            <button data-filter="done"   class="filter-chip">Completed</button>
          </div>

          <!-- Task list -->
          <section id="taskList" class="space-y-2.5"></section>

          <!-- Empty state -->
          <div id="emptyState" class="hidden text-center py-16">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-slate-100 grid place-items-center mb-4">
              <svg class="w-8 h-8 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            </div>
            <p id="emptyStateText" class="text-slate-500 font-medium">No tasks yet</p>
            <p class="text-sm text-slate-400">Add your first task above to start tracking progress.</p>
          </div>

        </div>
      </div>
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl2 bg-slate-900 text-white text-sm font-medium shadow-lg
              opacity-0 translate-y-3 pointer-events-none transition-all duration-300"></div>

  <script src="app.js"></script>
</body>
</html>
